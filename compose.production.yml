name: cc-tracker

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  REDIS_URL: redis://redis:6379

x-default-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]

  redis:
    image: redis:8-bookworm
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment: *app-environment
    command: ['node', 'packages/database/dist/src/migrate-cli.js']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *default-logging
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      <<: *app-environment
      API_HOST: 0.0.0.0
      API_PORT: 3000
      API_DB_POOL_MAX: ${API_DB_POOL_MAX:-5}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      AUTH_COOKIE_SECURE: 'true'
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - avatar_uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      <<: *app-environment
      WORKER_DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-3}
      CF_API_BASE_URL: ${CF_API_BASE_URL:-https://codeforces.com/api}
      CF_REQUEST_INTERVAL_MS: ${CF_REQUEST_INTERVAL_MS:-2200}
      SCHEDULER_ENABLED: 'true'
      SYNC_CAPACITY_RESERVE_PERCENT: ${SYNC_CAPACITY_RESERVE_PERCENT:-0.25}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.kill(1,0)']
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8080/']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]

networks:
  backend:
    internal: false

volumes:
  postgres_data:
  redis_data:
  avatar_uploads:
